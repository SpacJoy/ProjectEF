import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import moze_intel.projecte.UpdateJson

import java.util.function.Consumer

plugins {
    id('java')
    id('eclipse')
    id('idea')
    id('maven-publish')
    // https://fabricmc.net/develop/
    // Loom 1.16+ (which Minecraft 26.x requires) is published under the 'net.fabricmc.fabric-loom'
    // plugin id; the legacy 'fabric-loom' id only exists for the older Loom lines.
    id('net.fabricmc.fabric-loom') version("${loom_version}")
}

tasks.named('wrapper', Wrapper) {
    //Define wrapper values here so as to not have to always do so when updating gradlew.properties
    //Note: Gradle distribution is downloaded from the Tencent mirror for better speeds in China;
    // setting distributionUrl directly (instead of gradleVersion) keeps the mirror after './gradlew wrapper' regenerations
    distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-9.8.0-bin.zip'
}

defaultTasks 'build'

idea {
    module {
        //Exclude directories from being managed
        for (String excludeDirName in ["run", "out", "logs", "gradle"]) {
            excludeDirs.add(new File(projectDir, excludeDirName))
        }
    }
}

version = "${projecte_version}"
group = "moze_intel.projecte"
project.base.archivesName = "ProjectEF-${minecraft_version}-PE${projecte_version}"

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion.set("")
}

sourceSets {
    api {
        //The API has no resources
        resources.srcDirs = []
    }
    main {
        resources {
            //Add the generated main module resources
            srcDirs += 'src/datagen/generated'
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
        }
        compileClasspath += api.output
        runtimeClasspath += api.output
        //EMI has no 26.3 release, so its integration stays in the tree (it is still the
        //reference implementation the REI classes are written against) but is not compiled.
        java {
            exclude 'moze_intel/projecte/integration/recipe_viewer/emi/**'
        }
    }
    //Note: The datagen source set is not compiled during the Fabric port; its generated output above is
    // shipped as-is. Porting datagen to Fabric Data Generation API is tracked in FABRIC_PORT_PLAN.md
    test {
        //The test source set is disabled during the Fabric port (depended on the NeoForge test framework)
        java.srcDirs = []
        resources.srcDirs = []
    }
}

configurations { configContainer ->
    //Make sure all our sub source set stuff extends the proper base configurations so that
    // they can see all the dependencies we have in dependencies, including Minecraft
    extendConfigurations(implementation, apiImplementation)
    extendConfigurations(compileOnly, apiCompileOnly)
    extendConfigurations(runtimeOnly, apiRuntimeOnly)
}

static void extendConfigurations(Configuration base, Configuration... configurations) {
    for (def configuration : configurations) {
        configuration.extendsFrom(base)
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
        //No vendor lock: foojay provisions whatever JDK 25 the machine has, and pinning
        // JETBRAINS would silently fall back when no JetBrains JDK 25 is installed.
    }
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/projecte.classtweaker')

    mods {
        projecte {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }

    runs {
        configureEach {
            if (project.hasProperty('forge_force_ansi')) {
                //Force ansi if declared as a gradle variable, as the auto detection doesn't detect IntelliJ properly
                // or eclipse's plugin that adds support for ansi escape in console
                property('terminal.ansi', (String) project.property('forge_force_ansi'))
            }
            property('projecte.skip_top', 'true')

            //if the selected toolchain is a JBR, enable DCEVM
            if (javaToolchains.launcherFor(java.toolchain).map { it.metadata.vendor }.getOrElse('').contains('JetBrains')) {
                vmArgs('-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition')
            }
        }
        client {
            client()
            configName = 'Fabric Client'
        }
        clientAlt {
            client()
            configName = 'Fabric Client Alt'
            // Force a different username for testing multiplayer interactions
            programArgs('--username', 'AltDev')
        }
        server {
            server()
            configName = 'Fabric Server'
            programArg('--nogui')
        }
    }
}

//Give the api source set access to the Minecraft/Fabric/mod dependencies of the main compile classpath.
//Note: We use the configuration (dependencies only) instead of sourceSets.main.compileClasspath, as the latter
// also contains api.output (added above), which would create a circular task dependency compileApiJava -> apiClasses
sourceSets.api.compileClasspath += configurations.compileClasspath

static void exclusiveRepo(RepositoryHandler handler, String url, String... groups) {
    exclusiveRepo(handler, url, filter -> {
        for (def group : groups) {
            filter.includeGroup(group)
        }
    })
}

static void exclusiveRepo(RepositoryHandler handler, String url, Consumer<InclusiveRepositoryContentDescriptor> filterSetup) {
    handler.exclusiveContent {
        it.forRepositories(handler.maven {
            setUrl(url)
        })
        it.filter { f -> filterSetup.accept(f) }
    }
}

repositories { RepositoryHandler handler ->
    mavenCentral()
    //JEI 31.x pulls net.mezzdev.config (mezz_config) alongside mezz.jei, so both groups must be let through.
    exclusiveRepo(handler, 'https://maven.blamejared.com', filter -> {
        filter.includeGroup('mezz.jei')
        filter.includeGroupAndSubgroups('net.mezzdev')
    })
    exclusiveRepo(handler, 'https://maven.shedaniel.me/', 'me.shedaniel', 'me.shedaniel.cloth')
    exclusiveRepo(handler, 'https://maven.architectury.dev/', 'dev.architectury')
    exclusiveRepo(handler, 'https://maven.ladysnake.org/releases', filter -> {
        filter.includeGroupAndSubgroups('org.ladysnake')
    })
    exclusiveRepo(handler, 'https://maven2.bai.lol', 'lol.bai', 'mcp.mobius.waila')//WTHIT
    exclusiveRepo(handler, 'https://api.modrinth.com/maven', 'maven.modrinth')//Jade, Trinkets
    exclusiveRepo(handler, 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/', filter -> {
        filter.includeGroupAndSubgroups('fuzs.forgeconfigapiport')
    })
    exclusiveRepo(handler, 'https://jitpack.io', 'com.github.Towdium')//PinIn
}

dependencies {
    //Minecraft 26.1+ is unobfuscated: no mappings declaration and no remapping of the produced jars.
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    //Java 25 no longer bundles JSR305 annotations
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    //Forge Config API Port keeps the NeoForge ModConfigSpec API available on Fabric; shipped via jar-in-jar
    include(implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"))
    //Permission node support (falls back to vanilla op levels when no permission mod is present); shipped via jar-in-jar
    include(implementation("me.lucko:fabric-permissions-api:${permissions_api_version}"))
    //Math library used by the EMC solver; nested jar instead of shading (Fabric loads nested libraries fine)
    include(implementation("org.apache.commons:commons-math3:3.6.1"))
    //Pinyin matching for the transmutation table search; nested jar (same artifact JECh nests, so Fabric Loader dedupes the two copies)
    include(implementation("com.github.Towdium:PinIn:${pinin_version}"))

    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    if (recipe_viewer == 'jei' || recipe_viewer == 'hybrid') {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    }

    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    //REI only declares basic-math (me.shedaniel.math.Point/Rectangle) as a runtime dependency, so the
    //category widgets that take those types cannot be compiled against without pulling it in explicitly
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    //EntryStacks#of resolves to an EntryStack<FluidStack>, so the Architectury fluid type has to be on the compile classpath too
    compileOnly("dev.architectury:architectury-fabric:22.0.3")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}")
    if (recipe_viewer == 'rei') {
        runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
    }

    compileOnly("maven.modrinth:jade:${jade_version}")
    compileOnly("mcp.mobius.waila:wthit-api:fabric-${wthit_version}")

    compileOnly("maven.modrinth:trinkets-updated:${trinkets_version}")
    compileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}")
    compileOnly("org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}")
    //Load Trinkets (and its jar-in-jar'd Cardinal Components) at dev runtime so the accessory integration can be exercised
    runtimeOnly("maven.modrinth:trinkets-updated:${trinkets_version}")
    runtimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}")
    runtimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}")
}

//Set the various variables/settings for the different process resources tasks
tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def versionProperties = ["version"             : projecte_version,
                             "minecraft_version"   : minecraft_version_range,
                             "loader_version_range": loader_version_range,
                             "fcap_version_range"  : fcap_version_range]
    inputs.properties(versionProperties)
    filesMatching('fabric.mod.json') {
        expand versionProperties
    }
    //Reference file kept from the NeoForge branch until the class tweaker conversion is fully validated
    exclude('META-INF/accesstransformer.cfg')
    def files = fileTree(dir: outputs.files.asPath, includes: ['**/*.json', '**/*.mcmeta'])
    doLast {
        for (def file : files) {
            file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}

def getManifestAttributes() {
    return [
            "Specification-Title"     : "ProjectEF",
            "Specification-Vendor"    : "ProjectEF",
            "Specification-Version"   : "${project.projecte_version}",
            "Implementation-Title"    : "ProjectEF",
            "Implementation-Version"  : "${project.projecte_version}",
            "Implementation-Vendor"   : "ProjectEF",
            "Automatic-Module-Name"   : "projecte"
    ]
}

//Note: Loom no longer produces remapJar/remapSourcesJar now that Minecraft ships unobfuscated,
// so the three Jar tasks below are the whole artifact set and nothing chains off remap* anymore.
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(sourceSets.api.output)
    manifest.attributes(getManifestAttributes())
}

tasks.named('sourcesJar', Jar) {
    dependsOn(classes, apiClasses)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    //Note: Already contains main source set's sources by default
    from(sourceSets.api.allJava)
    manifest.attributes(getManifestAttributes())
}

def apiJar = tasks.register('apiJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    archiveClassifier.set("api")
    from(sourceSets.api.output)
    manifest.attributes(getManifestAttributes())
}

tasks.register('updateJSON', UpdateJson)

tasks.withType(JavaCompile).configureEach({
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
})

tasks.withType(Javadoc).configureEach({
    options.encoding = 'UTF-8'
    options.tags = [
            'apiNote:a:<em>API Note:</em>',
            'implSpec:a:<em>Implementation Requirements:</em>',
            'implNote:a:<em>Implementation Note:</em>'
    ]
})

artifacts {
    archives(apiJar)
}

publishing {
    publications { PublicationContainer publicationContainer ->
        mavenJava(MavenPublication) { MavenPublication publication ->
            publication.from((SoftwareComponent) components.java)
            publication.groupId = project.group
            publication.version = project.version
            publication.artifactId = 'ProjectEF'
            publication.artifact(apiJar)
            publication.pom {
                name.set('ProjectEF')
                packaging = 'jar'
                scm {
                    url.set('https://github.com/wchiway/ProjectEF.git')
                }
                issueManagement {
                    system.set('github')
                    url.set('https://github.com/wchiway/ProjectEF/issues')
                }
                licenses {
                    license {
                        name.set('MIT')
                        distribution.set('repo')
                    }
                }
            }
        }
    }
}
