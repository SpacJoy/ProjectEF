# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
# Loom 1.16+ (required by Minecraft 26.x) needs a Java 25 Gradle daemon; the toolchain below
# only controls what compiles the sources, not the JVM running Gradle itself.
org.gradle.java.home=D:/Program Files/Java/zulu-25
# Disabled while the 26.3 build stabilises; re-enable once the configuration is settled.
org.gradle.configuration-cache=false

projecte_version=1.3.5
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# Fabric toolchain (https://fabricmc.net/develop/)
# Minecraft 26.1+ ships unobfuscated, so there are no mappings and Loom no longer remaps.
loom_version=1.18.2
loader_version=0.19.5
loader_version_range=>=0.19.5
fabric_version=0.165.0+26.3

junit_version=5.11.4

#misc settings
# recipe viewer used at dev runtime, currently accepts: jei, rei, hybrid, none
recipe_viewer=jei

# Required library versions
# Forge Config API Port (keeps NeoForge ModConfigSpec API on Fabric), jar-in-jar'd
fcap_version=26.3.1
fcap_version_range=>=26.3.0
# fabric-permissions-api (me.lucko), jar-in-jar'd
permissions_api_version=0.7.0
# PinIn (Chinese pinyin matching, MIT, from JitPack), jar-in-jar'd
# 1.6.0 is the latest release and the same artifact Just Enough Characters nests.
pinin_version=1.6.0

# Mod dependency versions (integrations, all optional at runtime)
# EMI is absent on purpose: it has no 26.3 release (latest is 1.1.24+1.21.1) and its
# integration sources are excluded from compilation in build.gradle.
jade_version=26.3.5+fabric
jei_version=31.17.0.107
rei_version=26.3.824
# Upstream Trinkets stopped at 1.21.1; the maintained fork "Trinkets Updated" keeps the
# same dev.emi.trinkets API package and ships 26.3 builds.
trinkets_version=4.2.1+26.3
cca_version=8.1.0
wthit_version=20.0.0
